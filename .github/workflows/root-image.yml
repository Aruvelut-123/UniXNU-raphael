name: Build root image (userdata / unixnu)

# Builds the root image that gets flashed into the `unixnu` partition and
# publishes it as a Release asset, so it can be downloaded without logging in
# to GitHub or to Apple.
#
# WHY macOS AND NOT LINUX
#   Both 22H390 restores (iOS for the payload, iPadOS for the kernelcache) ship
#   their OS / SystemOS disk images as `.dmg.aea`. UniXNU decrypts those with
#   macOS `/usr/bin/aea` plus `ipsw fw aea --key`; on Linux `Ipsw.disk_image()`
#   raises instead of half-reading them. `.github/workflows/ipsw-convert.yml`
#   stays for UDIF-only images and cannot handle this build.
#
# WHAT IT PRODUCES
#   out/raphael/userdata/userdata-root.img  -- the raw SHNGROOT image, and
#   unixnu.sparse                            -- the same image as libsparse
#   chunks that `fastboot flash unixnu <file>` accepts.
#
# The payload is read straight from Apple's CDN over HTTPS range requests, so
# nothing is checked in. A Release is created only for tag pushes; a manual
# dispatch uploads the artifacts and prints the raw sizes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reuse_release_tag:
        description: "Existing tag whose release should receive the images (empty = artifacts only)"
        required: false
        default: ""
      skip_sparse:
        description: "Only build the raw image, skip the sparse conversion"
        type: boolean
        required: false
        default: false
      include_raw_parts:
        description: "Also publish the raw image parts (doubles the upload; sparse is what fastboot needs)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: unixnu-raphael-root-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICE_DIR: ${{ github.workspace }}/device
  UNIXNU_DIR: ${{ github.workspace }}/UniXNU
  UNIXNU_DEVICE: ${{ github.workspace }}/device
  HOMEBREW_NO_AUTO_UPDATE: 1
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  root-image:
    # macOS for /usr/bin/aea and hdiutil; the root image cannot be assembled
    # anywhere else.
    runs-on: macos-26
    timeout-minutes: 240
    outputs:
      publishes_release: ${{ steps.mode.outputs.publishes_release }}
    steps:
      - name: Decide what this run produces
        id: mode
        run: |
          # A tag push, or a manual run that names an existing tag, publishes a
          # Release. `inputs.*` is empty on a tag push, so test the ref first.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            publishes_release=true
          elif [ -n "${{ inputs.reuse_release_tag }}" ]; then
            publishes_release=true
          else
            publishes_release=false
          fi
          echo "publishes_release=$publishes_release" >> "$GITHUB_OUTPUT"
          echo "publishes_release=$publishes_release"

      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install AEA tooling
        run: |
          # UniXNU's decrypt_aea() shells out to both of these.
          brew install blacktop/tap/ipsw
          /usr/bin/aea -h >/dev/null 2>&1 && echo "aea present" || echo "::warning::/usr/bin/aea missing on this runner"

      - name: Install the board's OS profile
        run: python3 "$DEVICE_DIR/scripts/install-device-profile.py" --unixnu "$UNIXNU_DIR"

      - name: Resolve the board
        run: |
          cd "$UNIXNU_DIR"
          ./unixnu defconfig raphael_defconfig -D "$DEVICE_DIR"
          ./unixnu status -D "$DEVICE_DIR" | tail -20

      - name: Check the payload sizes before downloading
        run: |
          cd "$UNIXNU_DIR"
          ./unixnu build userdata --dry-run -D "$DEVICE_DIR"

      - name: Build the root image
        id: root
        run: |
          cd "$DEVICE_DIR"
          # scripts/build-root.sh resolves the output path from the build's own
          # report. Never hardcode it: ctx.work is
          # out/<board>/<os profile>/<config> (config.py:146-164), and <config>
          # is the selected defconfig minus its suffix, so the path cannot be
          # reconstructed from board.toml alone.
          # pipefail so a failed build cannot be hidden by tee's exit status.
          set -o pipefail
          scripts/build-root.sh | tee "$GITHUB_WORKSPACE/build-root.log"
          # Re-publish the resolved path for the later steps.
          IMAGE="$(sed -n 's/^image: \(.*\)$/\1/p' "$GITHUB_WORKSPACE/build-root.log" | tail -1)"
          if [ -z "$IMAGE" ] || [ ! -f "$IMAGE" ]; then
            echo "::error::build-root.sh did not report a usable image path"
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "resolved root image: $IMAGE"

      - name: Convert to a sparse image
        if: ${{ !inputs.skip_sparse }}
        run: |
          cd "$DEVICE_DIR"
          python3 scripts/ipsw_to_sparse.py \
            --raw-image "${{ steps.root.outputs.image }}" \
            --output "$GITHUB_WORKSPACE/unixnu.sparse"
          ls -lh "$GITHUB_WORKSPACE/unixnu.sparse"

      - name: Collect products
        run: |
          mkdir -p dist
          IMAGE="${{ steps.root.outputs.image }}"
          cp -v "$IMAGE" dist/userdata-root.img
          cp -v "$(dirname "$IMAGE")/userdata-root.json" dist/ 2>/dev/null || true
          if [ -f "$GITHUB_WORKSPACE/unixnu.sparse" ]; then cp -v "$GITHUB_WORKSPACE/unixnu.sparse" dist/; fi
          echo '--- flash it yourself, there is no --flash in CI ---' > dist/FLASH.txt
          echo '  fastboot flash unixnu unixnu.sparse' >> dist/FLASH.txt
          echo '  # or the raw image, if you prefer:' >> dist/FLASH.txt
          echo '  fastboot flash unixnu userdata-root.img' >> dist/FLASH.txt
          ls -lh dist/

      # A Release rejects any single asset of 2 GiB or more:
      #   Validation Failed: {"resource":"ReleaseAsset","field":"size",
      #   "message":"size must be less than 2147483648"}
      # The images are 7.85 GiB, so the Release can only carry them as parts.
      - name: Split the images for the release
        if: ${{ steps.mode.outputs.publishes_release == 'true' }}
        run: |
          mkdir -p release
          # Only the sparse image by default: it is what `fastboot flash unixnu`
          # takes, and it expands to the same 11.19 GiB. Splitting and uploading
          # the raw image as well would double the transfer for a file nobody
          # flashes. include_raw_parts turns it back on.
          images="dist/unixnu.sparse"
          if [ "${{ inputs.include_raw_parts }}" = "true" ]; then
            images="dist/unixnu.sparse dist/userdata-root.img"
          fi
          for image in $images; do
            [ -f "$image" ] || continue
            python3 "$DEVICE_DIR/scripts/ipsw_split.py" split \
              --input "$image" --output-dir release
          done
          # A short note the downloader reads first.
          {
            echo 'The image is split because GitHub Releases cap a single'
            echo 'asset at 2 GiB (2147483648 bytes). Rejoin the parts and check'
            echo 'the sha256 the manifest printed before flashing.'
            echo ''
            echo '  cat unixnu.sparse.part* > unixnu.sparse'
            echo '  sha256sum unixnu.sparse'
            echo ''
            echo 'Or use the helper, which verifies every part as it joins:'
            echo ''
            echo '  python3 ipsw_split.py join --manifest unixnu.sparse.parts.json --output unixnu.sparse'
            echo ''
            echo 'Then:'
            echo ''
            echo '  fastboot flash unixnu unixnu.sparse'
          } > release/README.txt
          cp -v dist/userdata-root.json release/ 2>/dev/null || true
          ls -lh release/

      # Artifacts and the release carry the same bytes, and the release is the one
      # that downloads without an account. So when a release is published, upload
      # only that: a duplicate artifact would just spend the runner's time and the
      # repository's artifact quota. A manual run with no tag still gets
      # artifacts, which is what the dry runs want; setting skip_artifacts on a
      # manual run with no release is therefore a no-op by design.
      - name: Upload raw root image
        if: ${{ steps.mode.outputs.publishes_release != 'true' && !inputs.skip_sparse }}
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-root-image
          path: dist/userdata-root.img
          if-no-files-found: error
          retention-days: 30

      - name: Upload sparse root image
        if: ${{ steps.mode.outputs.publishes_release != 'true' && !inputs.skip_sparse }}
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-sparse
          path: dist/unixnu.sparse
          if-no-files-found: warn
          retention-days: 30

      # Publish so the image can be fetched without a GitHub account.
      # Only the parts and the small files go here: the whole images are over
      # the 2 GiB release-asset ceiling and would fail the upload outright.
      #
      # NOT softprops/action-gh-release: it reads every file into memory and
      # uploads them serially. With ~19.6 GiB of parts the "Publish release
      # assets" step sat at 66 MiB for over an hour and never finished. Each
      # file gets its own `gh release upload` here, with retries, which also
      # makes a single stalled part recoverable instead of fatal.
      - name: Publish release assets
        if: ${{ steps.mode.outputs.publishes_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.reuse_release_tag || github.ref_name }}
        run: |
          set -uo pipefail
          # Create the release once, or reuse it if a previous attempt made it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists, adding to it"
          else
            gh release create "$TAG" --title "$TAG" --draft \
              --notes "Root images for raphael (Redmi K20 Pro / Mi 9 T Pro, SM8150).
          iPadOS 18.7.12 / build 22H390 / Darwin 24.6.0.

          Flash into the \`unixnu\` partition:

          \`\`\`sh
          # rejoin the parts first (GitHub caps a release asset at 2 GiB)
          cat unixnu.sparse.part* > unixnu.sparse
          sha256sum unixnu.sparse   # must match unixnu.sparse.parts.json
          fastboot flash unixnu unixnu.sparse
          \`\`\`

          \`userdata-root.json\` records the per-window sha256 and the manifest
          layout, so the flash can be verified afterwards. The image holds the
          unmodified iOS 18.7.12 \`OS\` and \`Cryptex1,SystemOS\` disks."
          fi
          # Small files first so the instructions are readable before the parts land.
          for f in release/README.txt release/userdata-root.json \
                   release/*.parts.json dist/FLASH.txt; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber || echo "::warning::upload failed: $f"
          done
          # Then the parts, one at a time, with retries.
          failed=0
          for f in release/*.part[0-9][0-9][0-9]; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            echo "::group::upload $(basename "$f") ($size bytes)"
            ok=0
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then
                ok=1
                break
              fi
              echo "attempt $attempt failed for $(basename "$f"), retrying"
              sleep $((attempt * 15))
            done
            echo "::endgroup::"
            if [ "$ok" -ne 1 ]; then
              echo "::error::could not upload $(basename "$f") after 3 attempts"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed part(s) failed to upload"
            exit 1
          fi
          # Only publish once every asset is actually there.
          gh release edit "$TAG" --draft=false
          echo "published $TAG"

      - name: Summary
        run: |
          {
            echo "### Root image"
             echo ""
             echo '| file | size |'
             echo '| --- | --- |'
             for f in dist/*.img dist/*.sparse; do
               [ -f "$f" ] && printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
             done
             echo ""
             if [ -d release ]; then
               echo 'Release parts (each under the 2 GiB asset limit):'
               echo ''
               echo '| part | size |'
               echo '| --- | --- |'
               for f in release/*.part*; do
                 [ -f "$f" ] && printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
               done
               echo ''
             fi
             echo 'Flash into the `unixnu` partition:'
             echo ''
             echo '```sh'
             echo 'cat unixnu.sparse.part* > unixnu.sparse'
             echo 'sha256sum unixnu.sparse   # must match unixnu.sparse.parts.json'
             echo 'fastboot flash unixnu unixnu.sparse'
             echo '```'
             echo ""
             echo 'The `userdata-root.json` beside it records the per-window sha256 and'
             echo 'the manifest so the flash can be verified afterwards.'
             echo ""
             echo 'Artifacts (`unixnu-sparse`, `unixnu-root-image`) carry the same images'
             echo 'whole; they need a GitHub account to download.'
           } >> "$GITHUB_STEP_SUMMARY"