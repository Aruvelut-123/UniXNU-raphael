name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release (e.g. v1.0.0)"
        required: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git patch flex bison bzip2 cpio rsync curl wget ca-certificates \
            tcsh unifdef cmake clang lld mtools build-essential pkg-config \
            ninja-build python3 python3-dev xz-utils libssl-dev zlib1g-dev \
            libbsd-dev uuid-dev llvm-dev libclang-dev device-tree-compiler

      - name: Clone UniXNU
        run: |
          git clone --recurse-submodules https://github.com/UniXNU/UniXNU.git UniXNU
          cd UniXNU
          ./unixnu defconfig raphael_defconfig -D ../UniXNU-raphael-ipados26
          ./unixnu fetch

      - name: Build kernel (ipados-17.7.11, arm64)
        run: |
          cd UniXNU
          ./unixnu kernel -D ../UniXNU-raphael-ipados26

      - name: Build EFI package
        run: |
          cd UniXNU
          ./unixnu package -D ../UniXNU-raphael-ipados26

      - name: Build firmware (requires uefi-raphael)
        if: env.HAS_UEFI == 'true'
        run: |
          cd UniXNU
          ./unixnu build firmware -D ../UniXNU-raphael-ipados26 --uefi ../uefi-raphael

      - name: Pack boot image
        run: |
          cd UniXNU
          ./unixnu bootimg -D ../UniXNU-raphael-ipados26

      - name: Collect artifacts
        run: |
          mkdir -p release
          # Copy EFI
          find UniXNU/out -name "UniXNU.efi" -exec cp -v {} release/ \;
          # Copy boot image
          find UniXNU/out -name "boot.img" -exec cp -v {} release/ \;
          # Copy kernel
          find UniXNU/out -name "kernel.macho" -exec cp -v {} release/ \;
          # Create release notes
          cat > release/RELEASE_NOTES.md <<'EOF'
          # UniXNU raphael build - ${{ github.ref_name }}

          ## Artifacts
          - **UniXNU.efi** - EFI boot manager and loader
          - **boot.img** - Android boot image (kernel + ramdisk + DTB)
          - **kernel.macho** - Prelinked XNU kernel

          ## Target
          - Device: Redmi K20 Pro / Mi 9T Pro (raphael, SM8150)
          - OS Profile: ipados-17.7.11-21H461 (arm64)
          - Kernel: xnu-10063.141.1

          ## Usage
          1. Flash userdata: `fastboot flash userdata <sparse.img>`
          2. Boot image: `fastboot boot boot.img`
          3. Or flash boot: `fastboot flash boot boot.img`

          ## Notes
          - SM8150 does NOT support arm64e/PAC; iPadOS 26+ requires PAC hardware.
          - This build targets iPadOS 17.7.11 (arm64).
          EOF
          ls -lh release/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/UniXNU.efi
            release/boot.img
            release/kernel.macho
            release/RELEASE_NOTES.md
          generate_release_notes: true

      - name: Upload artifacts (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-raphael-manual
          path: release/*
          retention-days: 30