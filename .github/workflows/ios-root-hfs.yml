name: ios-root-hfs

# Builds the HFS+ iOS root volume that the SWEET kernel mounts from the
# `userdata` partition (rd=ufsroot0). This needs a real Linux kernel with
# FUSE, hfsplus and rsync, so it runs here instead of on the workstation.
#
# The result is published as split release assets (GitHub caps a single
# asset at 2 GiB); concatenate the parts in order to recover the image.

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: "IPSW to pull the root components from"
        required: true
        default: "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
      os_dmg:
        description: "OS component"
        required: true
        default: "087-86698-044.dmg"
      sysos_dmg:
        description: "Cryptex1,SystemOS component"
        required: true
        default: "087-86593-047.dmg"
      appos_dmg:
        description: "Cryptex1,AppOS component"
        required: true
        default: "087-86715-047.dmg"
      size:
        description: "HFS+ volume size"
        required: true
        default: "16G"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Report free space
        run: df -h /

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apfs-fuse hfsprogs rsync unzip curl python3
          echo "--- versions ---"
          apfs-fuse --help 2>&1 | head -3 || true
          mkfs.hfsplus -V 2>&1 | head -2 || true
          fsck.hfsplus -h 2>&1 | head -3 || true
          echo "--- fuse ---"
          ls -l /dev/fuse || echo "no /dev/fuse"
          sudo modprobe fuse 2>&1 || true
          ls -l /dev/fuse || echo "no /dev/fuse after modprobe"

      - name: Fetch ios-sweet root tools
        run: |
          set -e
          base=https://raw.githubusercontent.com/dipa-studio/ios-sweet/main/tools
          curl -fsSL -o mkiosroot.sh "$base/mkiosroot.sh"
          curl -fsSL -o sweet-root-tweaks.py "$base/sweet-root-tweaks.py"
          chmod +x mkiosroot.sh sweet-root-tweaks.py
          head -5 mkiosroot.sh

      - name: Download IPSW
        run: |
          set -e
          curl -fL --retry 4 --retry-delay 10 --retry-all-errors \
            -o ipsw.zip "${{ inputs.ipsw_url }}"
          ls -l ipsw.zip
          df -h /

      - name: Extract the three root components
        run: |
          set -e
          mkdir -p dmg
          unzip -j -o ipsw.zip "${{ inputs.os_dmg }}" "${{ inputs.sysos_dmg }}" "${{ inputs.appos_dmg }}" -d dmg
          rm -f ipsw.zip
          ls -l dmg
          df -h /

      - name: Build HFS+ root
        run: |
          set -e
          sudo bash mkiosroot.sh \
            "dmg/${{ inputs.os_dmg }}" \
            "dmg/${{ inputs.sysos_dmg }}" \
            "dmg/${{ inputs.appos_dmg }}" \
            ios16-root.img "${{ inputs.size }}"
          ls -l ios16-root.img
          df -h /

      - name: Apply bring-up tweaks
        run: |
          set -e
          sudo mkdir -p /mnt/iosroot
          sudo mount -t hfsplus -o loop,force ios16-root.img /mnt/iosroot
          sudo python3 sweet-root-tweaks.py /mnt/iosroot
          sudo umount /mnt/iosroot
          sudo fsck.hfsplus -f -y ios16-root.img || true
          sudo fsck.hfsplus -f -n ios16-root.img || true
          rm -rf dmg
          df -h /

      - name: Sanity check the volume
        run: |
          set -e
          mkdir -p /tmp/chk
          sudo mount -t hfsplus -o loop,force,ro ios16-root.img /tmp/chk
          echo "--- top level ---"
          ls /tmp/chk
          echo "--- key paths ---"
          for p in sbin/launchd System/Library/CoreServices/SystemVersion.plist \
                   System/Library/Caches/com.apple.dyld \
                   private/preboot/Cryptexes/OS private/preboot/Cryptexes/App \
                   private/var/keybags/systembag.kb; do
            if sudo test -e "/tmp/chk/$p"; then echo "OK   $p"; else echo "MISS $p"; fi
          done
          echo "--- dyld cache files ---"
          sudo ls /tmp/chk/System/Library/Caches/com.apple.dyld | head -5
          sudo umount /tmp/chk

      - name: Convert to Android sparse
        run: |
          set -e
          python3 scripts/mksimg.py ios16-root.img -o ios16-root.simg
          ls -l ios16-root.simg
          rm -f ios16-root.img
          sha256sum ios16-root.simg | tee ios16-root.simg.sha256
          df -h /

      - name: Split and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          split -b 1900M -d -a 2 ios16-root.simg root-part.
          ls -l root-part.*
          sha256sum root-part.* > root-parts.sha256
          cat root-parts.sha256
          tag="iosroot-16.7.16-$(date +%Y%m%d-%H%M%S)"
          {
            echo "HFS+ iOS root for the SWEET kernel, built from ${{ inputs.ipsw_url }}"
            echo ""
            echo "Volume: ${{ inputs.size }} case-sensitive journaled HFS+ (label iOSRoot)"
            echo "Flash with:"
            echo '```'
            echo 'cat root-part.* > ios16-root.simg'
            echo 'fastboot flash userdata ios16-root.simg'
            echo '```'
            echo ""
            echo "Sparse image sha256: see ios16-root.simg.sha256"
          } > notes.md
          gh release create "$tag" root-part.* ios16-root.simg.sha256 root-parts.sha256 \
            --title "$tag" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "published $tag"
