name: ios-root-hfs

# Builds the HFS+ iOS root volume that the SWEET kernel mounts from the
# `unixnu` partition (rd=ufsroot0 + ufsroot=unixnu). This needs a real Linux
# kernel with FUSE, hfsplus and rsync, so it runs here instead of on the
# workstation.
#
# The result is published as split release assets (GitHub caps a single
# asset at 2 GiB); concatenate the parts in order to recover the image.
#
# The iOS release is now parameterised: ipsw_url defaults to the verified
# iPhone 11 / iOS 26.0 restore, while os_dmg / sysos_dmg / appos_dmg / size
# are still PLACEHOLDERS that MUST be filled from the IPSW before this
# workflow can run.  Do NOT invent an IPSW URL or a DMG member name.
#
# !! KNOWN BLOCKER FOR iOS 26 -- READ BEFORE DISPATCHING !!
# In iOS 26 the OS and Cryptex1,SystemOS volumes ship as AEA-ENCRYPTED
# containers, not plain DMGs.  Verified from the live 26.6.2 IPSW: both
# `094-95954-090.dmg.aea` (OS) and `094-97202-092.dmg.aea` (SystemOS) begin
# with the `AEA1` magic, while Cryptex1,AppOS (`094-96441-094.dmg`) does not.
# The userland root lives in the OS volume, and the `apfs-fuse` extraction
# this workflow performs CANNOT open an AEA container.  This workflow
# therefore cannot produce an iOS 26 root until an AEA unwrap step is added
# before the "Extract the OS volumes" step.  See research-ios26.md.
# The 16.7.16 flow still works because its three DMGs are plain UDIF images.

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: "IPSW to pull the root components from"
        required: true
        # [VERIFIED] iPhone 11 (iPhone12,1) iOS 26.0 (23A341) restore IPSW via
        # ipsw.me API; sha256 65da7bf14d281fba63a11c61e09d4a3a4b865d49f7e628d97295633758a347bb.
        # Not currently signed by Apple — treated as an archive source of files,
        # not a restore target.
        default: "https://updates.cdn-apple.com/2025FallFCS/fullrestores/093-40149/C2DDBCFD-327C-417B-A463-8F7820561E80/iPhone12,1_26.0_23A341_Restore.ipsw"
      os_dmg:
        description: "OS component"
        required: true
        # [UNVERIFIED] iOS 26 member IDs are build-specific and cannot be
        # derived from the 16.7.16 values. Confirm with
        #   unzip -l <ipsw> | grep -E '\.dmg$'
        # before running this workflow.
        default: "<PLACEHOLDER: iOS 26 OS.dmg member name>"
      sysos_dmg:
        description: "Cryptex1,SystemOS component"
        required: true
        default: "<PLACEHOLDER: iOS 26 SystemOS.dmg member name>"
      appos_dmg:
        description: "Cryptex1,AppOS component"
        required: true
        default: "<PLACEHOLDER: iOS 26 AppOS.dmg member name>"
      size:
        description: "HFS+ volume size"
        required: true
        default: "<PLACEHOLDER: iOS 26 HFS+ volume size, e.g. 16G>"

permissions:
  contents: write

jobs:
  build:
    # Pin the image: `ubuntu-latest` is now 26.04, whose archive has dropped
    # apfs-fuse (and the 24.04 hfsplus/hfsprogs pairing is what upstream
    # mkiosroot.sh is tested against).
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install host tools
        run: |
          set -e
          df -h /
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            hfsprogs rsync unzip curl python3 \
            build-essential cmake pkg-config libfuse3-dev libbz2-dev zlib1g-dev \
            libattr1-dev libicu-dev libssl-dev
          # Optional: the probe step builds upstream master when this is absent.
          sudo apt-get install -y --no-install-recommends apfs-fuse \
            || echo "::warning::apfs-fuse is not packaged here; the probe step will build it"
          echo "--- apfs-fuse ---"
          which apfs-fuse && apfs-fuse --help 2>&1 | head -3 || true
          echo "--- hfsprogs ---"
          mkfs.hfsplus -V 2>&1 | head -2 || true
          echo "--- modules ---"
          sudo modprobe hfsplus || echo "hfsplus module missing"
          sudo modprobe fuse || true
          ls -l /dev/fuse || echo "no /dev/fuse"
          grep -c hfsplus /proc/filesystems || true

      - name: Download IPSW
        run: |
          set -e
          curl -fL --retry 4 --retry-delay 10 --retry-all-errors \
            -o ipsw.zip "${{ inputs.ipsw_url }}"
          ls -l ipsw.zip
          df -h /

      - name: Extract the three root components
        run: |
          set -e
          mkdir -p dmg
          unzip -j -o ipsw.zip "${{ inputs.os_dmg }}" "${{ inputs.sysos_dmg }}" "${{ inputs.appos_dmg }}" -d dmg
          rm -f ipsw.zip
          ls -l dmg
          df -h /
          # An AEA container is not a DMG: apfs-fuse will fail on it with a
          # confusing error, and the failure would otherwise surface as a
          # generic "apfs-fuse failed" fallback that retries a doomed rebuild.
          # Detect the magic here and stop with an actionable message.  iOS 26
          # ships OS and SystemOS this way; the 16.x DMGs are plain UDIF.
          for f in dmg/*; do
            magic=$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')
            if [ "$magic" = "41454131" ]; then
              echo "::error file=$f::$f is an AEA-encrypted container (AEA1 magic), not a plain DMG."
              echo "The apfs-fuse extraction below cannot open it."
              echo "An AEA unwrap step must run before this job for this iOS release."
              echo "See research-ios26.md ('Lead independent confirmation of the AEA blocker')."
              exit 1
            fi
            echo "$f: not AEA (magic=$magic)"
          done

      # Fail here (2 minutes in) rather than after the hour-long copy when the
      # packaged apfs-fuse cannot read the IPSW's Apple Disk Images: retry with
      # a build of upstream master, which tracks Apple's newer compression.
      - name: Probe the disk images with apfs-fuse
        run: |
          set -e
          probe() {
            local dmg=$1 mnt=$2 rc=0
            sudo rm -rf "$mnt"; mkdir -p "$mnt"
            sudo apfs-fuse "$dmg" "$mnt" || rc=$?
            echo "apfs-fuse exit=$rc on $dmg"
            sudo ls -la "$mnt" || true
            if [ "$rc" -ne 0 ]; then return 1; fi
            sudo ls "$mnt/root" | head -8 || { sudo umount "$mnt" || true; return 1; }
            sudo umount "$mnt" 2>/dev/null || sudo fusermount -u "$mnt" || true
            sudo rm -rf "$mnt"
            return 0
          }

          ok=1
          if command -v apfs-fuse >/dev/null 2>&1; then
            probe "dmg/${{ inputs.os_dmg }}" /tmp/probe_os || ok=0
            probe "dmg/${{ inputs.sysos_dmg }}" /tmp/probe_sys || ok=0
            probe "dmg/${{ inputs.appos_dmg }}" /tmp/probe_app || ok=0
          else
            echo "apfs-fuse is not installed"
            ok=0
          fi

          if [ "$ok" = 1 ]; then
            echo "packaged apfs-fuse is able to read all three images"
            exit 0
          fi

          echo "::warning::packaged apfs-fuse failed; building upstream master"
          git clone --depth 1 --recursive https://github.com/sgan81/apfs-fuse /tmp/apfs-src
          cmake -S /tmp/apfs-src -B /tmp/apfs-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/apfs-src/build -j"$(nproc)"
          sudo install -m 0755 /tmp/apfs-src/build/apfs-fuse /usr/local/bin/apfs-fuse
          hash -r
          which apfs-fuse
          apfs-fuse --help 2>&1 | head -3 || true

          probe "dmg/${{ inputs.os_dmg }}" /tmp/probe_os
          probe "dmg/${{ inputs.sysos_dmg }}" /tmp/probe_sys
          probe "dmg/${{ inputs.appos_dmg }}" /tmp/probe_app
          echo "upstream apfs-fuse works"

      - name: Fetch ios-sweet root tools
        run: |
          set -e
          base=https://raw.githubusercontent.com/dipa-studio/ios-sweet/main/tools
          curl -fsSL -o mkiosroot.sh "$base/mkiosroot.sh"
          curl -fsSL -o sweet-root-tweaks.py "$base/sweet-root-tweaks.py"
          chmod +x mkiosroot.sh sweet-root-tweaks.py
          head -5 mkiosroot.sh

      - name: Build HFS+ root
        run: |
          set -e
          sudo bash mkiosroot.sh \
            "dmg/${{ inputs.os_dmg }}" \
            "dmg/${{ inputs.sysos_dmg }}" \
            "dmg/${{ inputs.appos_dmg }}" \
            ios26-root.img "${{ inputs.size }}"
          ls -l ios26-root.img
          df -h /

      - name: Apply bring-up tweaks
        run: |
          set -e
          # Apple's OS.dmg has /private/var as a bare mount point: recreate the
          # data-volume skeleton the tweaks write into (mobile 501, as on iOS).
          sudo mkdir -p /mnt/iosroot
          sudo modprobe hfsplus || true
          sudo mount -t hfsplus -o loop,force ios26-root.img /mnt/iosroot
          for d in private/var/mobile private/var/mobile/Library \
                   private/var/mobile/Library/Preferences private/var/root; do
            sudo mkdir -p "/mnt/iosroot/$d"
            sudo chown 501:501 "/mnt/iosroot/$d"
            sudo chmod 0755 "/mnt/iosroot/$d"
          done
          echo "--- /private/var before tweaks ---"
          sudo ls /mnt/iosroot/private/var || true
          sudo python3 sweet-root-tweaks.py /mnt/iosroot
          # The upstream tweaks skip the activation seed: Apple's OS.dmg ships
          # no mobileactivationd system container, so there is nothing to find.
          # Seed the container the upstream bring-up image used by hand, so
          # mobileactivationd starts out Activated instead of blocking on the
          # activation check.
          sudo python3 scripts/seed_activation.py /mnt/iosroot \
            --product-version "<PLACEHOLDER: iOS 26 ProductVersion>" \
            --build-version "<PLACEHOLDER: iOS 26 BuildVersion>"
          echo "--- tweak results ---"
          sudo ls /mnt/iosroot/private/var/mobile/Library/Preferences
          sudo grep -c _PanicOnCrasX /mnt/iosroot/System/Library/xpc/launchd.plist || true
          sudo cat "/mnt/iosroot/private/var/containers/Data/System/D90C94C4-F94E-4FCF-8A28-A93BE3846D8E/Library/internal/data_ark.plist"
          sudo umount /mnt/iosroot
          fsck.hfsplus -f -y ios26-root.img || true
          fsck.hfsplus -f -n ios26-root.img || true
          rm -rf dmg
          df -h /

      - name: Sanity check the volume
        run: |
          set -e
          mkdir -p /tmp/chk
          sudo mount -t hfsplus -o loop,force,ro ios26-root.img /tmp/chk
          echo "--- top level ---"
          ls /tmp/chk
          echo "--- key paths ---"
          for p in sbin/launchd System/Library/CoreServices/SystemVersion.plist \
                   System/Library/Caches/com.apple.dyld \
                   private/preboot/Cryptexes/OS private/preboot/Cryptexes/App \
                   private/var/keybags/systembag.kb \
                   private/var/mobile/Library/Preferences/com.apple.purplebuddy.plist; do
            if sudo test -e "/tmp/chk/$p"; then echo "OK   $p"; else echo "MISS $p"; fi
          done
          echo "--- dyld cache files ---"
          sudo ls /tmp/chk/System/Library/Caches/com.apple.dyld | head -5
          echo "--- usage ---"
          df -h /tmp/chk
          sudo umount /tmp/chk

      - name: Convert to Android sparse
        run: |
          set -e
          python3 scripts/mksimg.py ios26-root.img -o ios26-root.simg
          ls -l ios26-root.simg
          rm -f ios26-root.img
          sha256sum ios26-root.simg | tee ios26-root.simg.sha256
          df -h /

      - name: Verify the published image
        run: |
          set -e
          # The steps above prove the volume itself.  This proves the file
          # that actually gets published -- the sparse image the phone will
          # be flashed with -- and it fails the build if the activation seed
          # did not make it into the bytes.
          python3 scripts/verify_root.py ios26-root.simg \
            --product-version "<PLACEHOLDER: iOS 26 ProductVersion>" \
            --build-version "<PLACEHOLDER: iOS 26 BuildVersion>"

      - name: Split and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          split -b 1900M -d -a 2 ios26-root.simg root-part.
          ls -l root-part.*
          sha256sum root-part.* > root-parts.sha256
          cat root-parts.sha256
          tag="iosroot-<PLACEHOLDER: iOS 26 version, e.g. 26.0>-$(date +%Y%m%d-%H%M%S)"
          {
            echo "HFS+ iOS root for the SWEET kernel, built from ${{ inputs.ipsw_url }}"
            echo ""
            echo "Volume: ${{ inputs.size }} case-sensitive journaled HFS+ (label iOSRoot)"
            echo "Flash with:"
            echo '```'
            echo 'cat root-part.* > ios26-root.simg'
            echo 'fastboot flash unixnu ios26-root.simg'
            echo '```'
            echo ""
            echo "Sparse image sha256: see ios26-root.simg.sha256"
          } > notes.md
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          gh release create "$tag" --title "$tag" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          # One asset at a time: a single failure then leaves the finished parts
          # published instead of losing the whole build.
          for f in root-part.* ios26-root.simg.sha256 root-parts.sha256; do
            echo "uploading $f"
            gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY"
          done
          echo "published $tag"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
