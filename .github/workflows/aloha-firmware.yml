name: Build raphael firmware and boot image (Project Aloha)

# The Mu-Silicium fork ships a raphael platform that has never booted on
# hardware, so this workflow builds the same firmware from Project Aloha
# instead: mu_aloha_platforms lists xiaomi-raphael as a supported target, and
# its SurfaceDuo1Pkg platform is what produced the known-good menu-diag2 image.
#
# Aloha already packs BootShim + the firmware volume into a complete Android
# boot image (PythonLibs/PostBuild.py), so unlike the UniXNU firmware step this
# one does not need Resources/Scripts/mkbootimg.py and does not go through
# ./unixnu bootimg. The UniXNU boot chain is compiled into the volume by
# patching the platform DSC/FDF, and the result is a ready-to-flash .img.
on:
  workflow_dispatch:
    inputs:
      aloha_repository:
        description: "Project Aloha platforms checkout (owner/name)"
        required: false
        default: "Project-Aloha/mu_aloha_platforms"
      aloha_ref:
        description: "Ref of the Aloha checkout"
        required: false
        default: "main"
      build_unixnu:
        description: "Compile the UniXNU boot chain into the firmware volume"
        type: boolean
        required: false
        default: true
      secureboot:
        description: "Build the Secure Boot variant instead of the NoSB one"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: aloha-raphael-${{ github.ref }}
  cancel-in-progress: false
env:
  DEVICE_DIR: ${{ github.workspace }}/device
  ALOHA_DIR: ${{ github.workspace }}/aloha
  UNIXNU_DIR: ${{ github.workspace }}/UniXNU
  UNIXNU_DEVICE: ${{ github.workspace }}/device

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Checkout Project Aloha platforms
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.aloha_repository }}
          ref: ${{ inputs.aloha_ref }}
          path: aloha
          submodules: recursive
          persist-credentials: false

      - name: Checkout UniXNU
        if: inputs.build_unixnu
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Stage the UniXNU boot chain into the Aloha platform
        env:
          # build_uefi.py has no way to forward -D to EDK II, so the switch
          # travels through this variable and the staging script writes it into
          # the DSC [Defines] block. Both device variants are patched, because
          # secureboot=false drives PlatformBuildNoSb.py and SurfaceDuo1NoSb.dsc.
          ALOHA_EXTRA_DEFINES: ${{ inputs.build_unixnu && 'BUILD_UNIXNU=1' || 'BUILD_UNIXNU=0' }}
        run: |
          python3 "$DEVICE_DIR/scripts/stage-aloha-unixnu.py" \
            --aloha "$ALOHA_DIR" \
            --unixnu "$UNIXNU_DIR" \
            --platform SurfaceDuo1 \
            --device xiaomi-raphael
      - name: Verify the staged switch
        run: |
          # Fail early if the switch did not land: a silent BUILD_UNIXNU=0 build
          # would still produce a flashable image, just without the boot chain.
          want=0
          if [ "${{ inputs.build_unixnu }}" = "true" ]; then want=1; fi
          for dsc in SurfaceDuo1.dsc SurfaceDuo1NoSb.dsc; do
            path="$ALOHA_DIR/Platforms/SurfaceDuo1Pkg/$dsc"
            if ! grep -Eq "BUILD_UNIXNU +=+ $want\$" "$path"; then
              echo "::error::$dsc does not carry BUILD_UNIXNU = $want"
              grep -n 'BUILD_UNIXNU' "$path" || true
              exit 1
            fi
            echo "$dsc: BUILD_UNIXNU = $want"
          done
          echo "staged includes:"
          ls -l "$ALOHA_DIR/Platforms/SurfaceDuo1Pkg/Include/UniXNU"*.inc


      - name: Install the EDK II toolchain
        run: |
          # Use the project's own setup script so the package list cannot drift;
          # python3-distutils is only needed on releases before 24.04 and has no
          # installation candidate there.
          sed -i 's/ python3-distutils//' "$ALOHA_DIR/build_setup.sh" || true
          cd "$ALOHA_DIR"
          sudo bash build_setup.sh
          pip install --upgrade -r pip-requirements.txt
          git config --global --add safe.directory '*'

      - name: Initialise the EDK II environment
        run: |
          cd "$ALOHA_DIR"
          python3 build_uefi.py --init

      - name: Build raphael UEFI and boot image
        env:
          # The platform build scripts append these to PACKAGES_PATH, which is a
          # hard-coded tuple inside them. Without it EDK II cannot resolve
          # UniXNUPkg/... or DarwinBootPkg/... and the build stops at the DSC.
          ALOHA_EXTRA_PACKAGES: ${{ github.workspace }}/UniXNU/package:${{ github.workspace }}/UniXNU/drivers/DarwinBoot
        run: |
          cd "$ALOHA_DIR"
          ARGS="-d xiaomi-raphael"
          if [ "${{ inputs.secureboot }}" = "true" ]; then ARGS="$ARGS -s 1"; fi
          echo "build_uefi.py $ARGS"
          echo "ALOHA_EXTRA_PACKAGES=$ALOHA_EXTRA_PACKAGES"
          python3 build_uefi.py $ARGS
          # build_uefi.py drives the platform build through os.system and never
          # looks at the exit status, so it reports success even when EDK II
          # died. Check for the artefacts it should have produced.
          fd=$(find "$ALOHA_DIR/Build" -path '*FV/SM8150_EFI.fd' -type f | head -1)
          if [ -z "$fd" ]; then
            echo "::error::EDK II produced no firmware volume"
            find "$ALOHA_DIR/Build" -maxdepth 3 -name '*.fd' -o -maxdepth 3 -name '*.log' 2>/dev/null | head -20
            exit 1
          fi
          echo "firmware volume: $fd ($(stat -c %s "$fd") bytes)"

      - name: Collect products
        run: |
          # build_uefi.py only populates ci_artifacts when WM_CI_BUILD is set, and
          # that path also builds both variants and moves the FD out of the tree.
          # Collect straight from the build output instead.
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -v "$ALOHA_DIR"/Build/SurfaceDuo1Pkg/*.img "$GITHUB_WORKSPACE/out/"
          cp -v "$ALOHA_DIR"/Build/SurfaceDuo1Pkg/RELEASE_CLANGPDB/FV/SM8150_EFI.fd "$GITHUB_WORKSPACE/out/"
          ls -l "$GITHUB_WORKSPACE/out"

      - name: Boot image availability
        run: |
          set -o pipefail
          shopt -s nullglob
          found=("$GITHUB_WORKSPACE"/out/*.img)
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::the build produced no boot image"
            exit 1
          fi
          for img in "${found[@]}"; do
            echo "$(basename "$img"): $(stat -c %s "$img") bytes"
            sha256sum "$img"
          done

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: aloha-raphael-bootimg
          path: |
            out/*.img
            out/*.fd
          compression-level: 9
          if-no-files-found: error
