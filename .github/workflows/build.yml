name: Build UniXNU (EFI / kernel / boot image)

# The device repository is checked out into ./device, and upstream UniXNU into
# ./UniXNU. UNIXNU_DEVICE points every ./unixnu invocation at the device tree.
# macOS-26 is used because upstream UniXNU only supports the Xcode toolchain
# for the XNU kernel step; scripts/linux/setup-toolchain.py builds a patched
# LLVM from source and is not suitable for a hosted Linux runner.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "Build the XNU kernel (Xcode toolchain, macOS-26)"
        type: boolean
        required: false
        default: true
      uefi_repository:
        description: "Optional Mu-Silicium UEFI checkout (owner/name) required for firmware + boot.img"
        required: false
        default: ""
      uefi_ref:
        description: "Ref of the optional UEFI checkout"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: unixnu-raphael-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICE_DIR: ${{ github.workspace }}/device
  UNIXNU_DIR: ${{ github.workspace }}/UniXNU
  UNIXNU_DEVICE: ${{ github.workspace }}/device
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: 1
  # prepare-xnu-source.py lists Apple sources through the GitHub API; anonymous
  # calls from hosted runners hit the shared rate limit (HTTP 403), which is
  # exactly how the first CI run died inside the kernel step.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Show toolchain
        run: |
          xcodebuild -version || true
          clang --version | head -2
          python3 --version

      - name: Install EDK II toolchain (LLVM + lld)
        run: |
          # The EFI package is built with EDK II's CLANGPDB tool chain, which needs
          # llvm-lib and lld-link. Apple's clang does not ship them.
          brew install llvm lld

      - name: Install the board's OS profile and stage the arm64 kernelcache
        run: |
          # Upstream UniXNU has no 18.x profile: this board carries one and copies
          # it into the checkout before resolving.
          python3 "$DEVICE_DIR/scripts/install-device-profile.py" --unixnu "$UNIXNU_DIR"
          # The payload IPSW is iOS 18 (arm64e kernelcache, unusable on SM8150).
          # The arm64 kernelcache is staged from the same-build iPadOS 18.7.12
          # restore of iPad7,11 (A10, no PAC) into the path [kernel.prelink]
          # names, so it cannot collide with out/ipsw/22H390/.
          python3 "$DEVICE_DIR/scripts/stage-arm64-kernelcache.py" --unixnu "$UNIXNU_DIR"

      - name: Select raphael defconfig and fetch sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$UNIXNU_DIR"
          ./unixnu defconfig raphael_defconfig -D "$DEVICE_DIR"
          ./unixnu fetch -D "$DEVICE_DIR"

      - name: Resolution report (ordered patches for the board's OS profile)
        run: |
          cd "$UNIXNU_DIR"
          ./unixnu status --json -D "$DEVICE_DIR" | tee "$GITHUB_WORKSPACE/status.json"

      - name: Build XNU kernel (arm64, board os_profile)
        if: github.event_name != 'workflow_dispatch' || inputs.build_kernel
        run: |
          cd "$UNIXNU_DIR"
          set +e
          ./unixnu build kernel -D "$DEVICE_DIR"
          rc=$?
          echo "=== kernel build rc=$rc ==="
          if [ $rc -ne 0 ]; then
            echo '::group::kernel-bootstrap.log (full)'
            find "$UNIXNU_DIR/out" -name 'kernel-bootstrap.log' -print -exec cat {} \;
            echo '::endgroup::'
            echo '::group::any config/sysconf leftovers'
            find "$UNIXNU_DIR/out" -name 'config.DEVELOPMENT_ARM64*' -o -name '*.sysconf*' 2>/dev/null | head
            echo '::endgroup::'
          fi
          exit $rc

      - name: Build UniXNU EFI application
        run: |
          cd "$UNIXNU_DIR"
          ./unixnu build package -D "$DEVICE_DIR"

      - name: Checkout optional UEFI firmware tree
        if: inputs.uefi_repository != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.uefi_repository }}
          ref: ${{ inputs.uefi_ref }}
          path: uefi-raphael
          submodules: recursive

      - name: Build firmware volume and boot.img
        if: inputs.uefi_repository != ''
        run: |
          cd "$UNIXNU_DIR"
          ./unixnu build firmware -D "$DEVICE_DIR" --uefi "$GITHUB_WORKSPACE/uefi-raphael"
          ./unixnu bootimg -D "$DEVICE_DIR" --uefi "$GITHUB_WORKSPACE/uefi-raphael"

      - name: Boot image availability
        run: |
          if [ -z "${{ inputs.uefi_repository }}" ]; then
            echo "::notice::boot.img needs a Mu-Silicium uefi-raphael checkout plus board.toml [firmware]/[payload]; dispatch this workflow with uefi_repository to build it."
          fi

      - name: Collect products
        run: |
          mkdir -p dist
          find "$UNIXNU_DIR/out" -name 'UniXNU.efi'   -exec cp -v {} dist/ \;
          find "$UNIXNU_DIR/out" -name 'kernel.macho' -exec cp -v {} dist/ \;
          find "$UNIXNU_DIR/out" -name 'boot.img'     -exec cp -v {} dist/ \;
          cp -v "$GITHUB_WORKSPACE/status.json" dist/
          ls -lh dist/

      - name: Upload UniXNU.efi
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-efi
          path: dist/UniXNU.efi
          if-no-files-found: error
          retention-days: 30

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-bootimg
          path: dist/boot.img
          if-no-files-found: warn
          retention-days: 30

      - name: Upload kernel.macho
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-kernel
          path: dist/kernel.macho
          if-no-files-found: warn
          retention-days: 30

      - name: Upload resolution report
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-status
          path: dist/status.json
          if-no-files-found: warn
          retention-days: 30

      # Two separately published primary products: boot.img and UniXNU.efi.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UniXNU.efi
            dist/boot.img
            dist/kernel.macho
            dist/status.json
          generate_release_notes: true
