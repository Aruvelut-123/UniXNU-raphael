schema_version = 2

[board]
name = "raphael"
soc = "SM8150"
soc_source = "sm8150"
# raphael (SM8150) CPUs are Cortex-A76/A55 which do NOT implement FEAT_PAuth,
# so arm64e-only profiles (ipados-26/27) cannot run here. iPadOS 18 still ships
# an arm64 slice (the 2019 iPad 7 with the same no-PAC A10 runs 18.7.12), so
# 18.7.12-22H390 / Darwin 24.6.0 is the target.
#
# Upstream UniXNU carries no 18.x profile: this repository's own copy lives in
# os-profiles/<profile>/ and is installed into the UniXNU checkout by
# scripts/install-device-profile.py before resolving.
#
# The profile pins BOTH Apple archives: [ipsw] is the arm64 iPadOS restore the
# kernel/firmware inputs come from, [payload-ipsw] is the iOS restore whose OS /
# SystemOS disk images become the root image. Same build number on both sides.
os_profile = "ipados-18.7.12-22H390"
kit = "raphael"
description = "Redmi K20 Pro / Mi 9T Pro (raphael, SM8150) - arm64 port of iPadOS 18.7.12 (22H390). Kernel from the arm64 iPadOS restore, root image from the iOS 18.7.12 payload."

[components]
include = ["XnuPrelink", "DarwinBoot", "ArmDTPlatform"]

[kernel]
defconfig = "raphael_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8150.config"]
# Darwin 24 (xnu-11417) dropped the BCM2837 machine configuration; the Darwin 23 arch
# series no longer applies. The xnu-darwin24 series re-derives the same 15 patches
# against xnu-11417 (12 file changes; timer-entry / trust-cache / freezer hunks have
# no object on Darwin 24 and are intentionally omitted). See patches/xnu-darwin24/.
patch_series = ["device:patches/xnu-darwin24/series", "soc:patches/xnu/series", "device:patches/xnu/os-bootstrap.series", "device:patches/xnu/series"]
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "build-raphael-cpu.py", "build-raphael-pthread.py"]

[device_tree]
source = "device:dts/raphael.dts"
include_dirs = ["soc:dts"]

[package]
unixnu = "../sources/UniXNU-packaging"
unixnu_repository = "UniXNU/UniXNU"
unixnu_revision = "main"

# Target of the root image. This is ONE device's GPT geometry — this
# maintainer's repartitioned 512 GB raphael, where `unixnu` is sda34 (128 GiB).
# Other handsets differ: re-measure your own disk and overwrite these numbers
# before flashing. sysfs reports 512-byte sectors:
#   adb shell su -c "cat /sys/block/sda/sda34/start /sys/block/sda/sda34/size"
#   last_lba = start + size - 1,  lba_bytes = 512
# See docs/root-partition.md.
[userdata]
first_lba = 718487514
last_lba = 986922969
lba_bytes = 512

# ---------------------------------------------------------------- boot image
# The Android boot image header that raphael's ABL expects. These are the
# values the platform's own build_uefi.py already uses (see the stock
# Mu-raphael.img headers): ABL loads the kernel at 0x10008000 and the ramdisk at
# 0x11000000 with 2048-byte pages. Without this section bootimg falls back to its
# DEFAULTS (base 0, page 4096), which puts the shim at 0x8000 and the device
# drops straight back to fastboot.
[bootimg.image]
header_version = 1
base = 0x10000000
kernel_offset = 0x8000
tags_offset = 0x100
ramdisk_offset = 0x1000000
second_offset = 0xf00000
pagesize = 2048
# ---------------------------------------------------------------- firmware
# The UEFI firmware comes from this repository's Mu-Silicium fork, branch
# raphael-bringup: a raphael-only tree that vendors the Project Aloha
# Binaries/raphael and Resources/DTBs/raphael.dtb, so no private checkout is
# needed. Its raphael.dsc / raphael.fdf embed the XNU boot chain (UniXNU,
# UniXNUDxe, UniXNURamDiskDxe, DarwinBoot), which the DSC pulls in from
# Include/UniXNU.dsc.inc.
#
# Point --uefi (or UNIXNU_UEFI) at that checkout:
#   git clone -b raphael-bringup https://github.com/Aruvelut-123/Mu-Silicium-raphael
#   ./unixnu build firmware --uefi ../Mu-Silicium-raphael
#
# Submodules are limited to the shared trees the DSC chain includes; Binaries
# is a plain directory in this fork and Mu_Basecore is provided as {edk2}.
[firmware]
config = "raphael"
dsc = "Platforms/Xiaomi/raphaelPkg/raphael.dsc"
fd = "Build/raphaelPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = [
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicium-ACPI",
  "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]
# Switches the DSC chain reads with $(...). SOC_TYPE 0 = SM8150-AB (Redmi K20
# Pro / Mi 9T Pro); the raphael package has no custom display driver and the
# build is unsigned, matching what build_uefi.py produces for this device.
[firmware.defines]
SOC_TYPE = "0"
USE_CUSTOM_DISPLAY_DRIVER = "0"
ENABLE_SECUREBOOT = "0"
DEVICE_MODEL = "0"
# Embeds the XNU boot chain in the FD (raphael.dsc/FDF pull it in through
# Include/UniXNU.dsc.inc). Requires the UniXNU package roots listed above.
BUILD_UNIXNU = "1"

[package.defconfig]
"ipados-18.7.12-22H390" = "raphael_defconfig"
