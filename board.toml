# Redmi K20 Pro / Mi 9T Pro (raphael, SM8150) device repository for UniXNU.
#
# raphael is the SAME SM8150 SoC as OnePlus 7 Pro (guacamole) and Xiaomi Pad 5
# (nabu). The XNU kernel and the Project Aloha UEFI are reused from the proven
# guacamole SM8150 bring-up (which reached iOS 16.7.16 userland); only the
# device tree (raphael.dtb) and the Apple Device Tree (ADT) device profile
# differ. Because the silicon is identical, raphael reuses guacamole's exact
# kernel build -> NO per-device kernel defconfig is required.
#
# The payload volume label is kept as "GUACESP" because the patched UniXNU
# firmware discovers the config by that label; it is cosmetic.

[board]
name = "raphael"
soc = "SM8150"
description = "Redmi K20 Pro / Mi 9T Pro (raphael)"
kit = "raphael"

[firmware]
config = "raphael"
dsc = "Platforms/SurfaceDuo1Pkg/SurfaceDuo1NoSb.dsc"
fd = "Build/SurfaceDuo1Pkg/{target}_CLANGPDB/FV/SM8150_EFI.fd"
submodules = [
  "MU_BASECORE",
  "Common/MU",
  "Common/MU_OEM_SAMPLE",
  "Platforms/CranePkg",
  "Platforms/SurfaceDuoACPI",
  "Features/DFCI",
  "Features/CONFIG",
  "Binaries",
  "Platforms/OpensslPkg/Library/OpensslLib/openssl",
  "Platforms/MbedTlsPkg/Library/MbedTlsLib/mbedtls",
]
packages = [
  "{uefi}/Platforms",
  "{uefi}/Common/MU",
  "{uefi}/Common/MU_OEM_SAMPLE",
  "{uefi}/Features/DFCI",
  "{uefi}/Features/CONFIG",
  "{uefi}/Binaries",
  "{uefi}/Silicon/QC/Sm8150",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]

[firmware.defines]
TARGET_DEVICE = "xiaomi-raphael"
FDT = "raphael.dtb"
SHARED_CRYPTO_PATH = "{edk2}/CryptoPkg/Binaries/edk2-basecrypto-driver-bin_extdep"
CONF_AUTOGEN_INCLUDE_PATH = "{uefi}/Common/MU/AndromedaPkg/Include"
MU_SCHEMA_DIR = "{uefi}/Common/MU/AndromedaPkg/CfgData"
MU_SCHEMA_FILE_NAME = "AndromedaPkgCfgData.xml"

[payload]
volume = "GUACESP"
size_mib = 64
loader = "firmware"
title = "Redmi K20 Pro - XNU"
dram_size = "0xc0000000"
panic_screen = false
timeout = 3
kernel_args = [
  "debug=0xc",
  "serial=3",
  "cpus=8",
  "keepsyms=1",
  "-enable_kprintf_spam",
  "-noprogress",
  # ufsroot= selects the GPT partition the SWEET kernel's bsd/dev/sweet_ufs.c
  # finds BY NAME on the internal UFS and exposes as BSD disk ufsroot0 -- so
  # nothing here may hardcode a partition index.  unixnu is the LAST populated
  # entry (index [61]) and no existing partition was renumbered.
  # Partition: unixnu, partGUID 66f93a3a-63ca-462e-ad71-e4a7838418fe,
  # first LBA 28945664 .. last LBA 62500095 (16 GiB).
  "rd=ufsroot0",
  "ufsroot=unixnu",
  "unentitled_ios_sim_launch=1",
  "ignition_level=1",
  "wdt_test=no_user_checkin",
  "ufsrw=1",
  "rootrw=1",
  "launchd_unsecure_cache=1",
  "wdt=-1",
  "sweetusb=2",
  "sweettouchdelay=20",
  "sweetfb_noconsole=1",
  "sweetfb_hz=30",
  "sweetgpu=3",
  "sweetlogdump=1",
]

[payload.adt]
tool = "scripts/make-raphael-adt.py"
unique_chip_id = "required"
# Match the working guacamole shim window. raphael has 6/8 GiB DRAM; 3 GiB also
# gives XNU the full kernel-managed RAM range and reserves enough early I/O
# page tables for the framebuffer.
owned_memory_size = "0xc0000000"
# Apple identity carried by the ADT (product type / model / chip-id / canvas /
# base-ADT source). These mirror scripts/devices.py's `ios` dict for raphael
# (iPhone 11 / N104AP, the first generation that runs iOS 26; iPhone XS
# D321AP tops out at 18.7.11). Set them here to override per-release.
# The IPSW URL and DeviceTree member are VERIFIED by the lead
# (research-ios26.md); the member name is flagged [UNVERIFIED] there.
ios_product_type = "N104AP"
ios_model = "iPhone12,1"
ios_chip_id = 0x8030
ios_canvas = "828x1792"
ios_display_scale = 2
base_adt = "scripts/base-iphone12-1.adt"

[bootimg.image]
base = 0x0
kernel_offset = 0x8000
# The ABL adds abl_base (the "Kernel" RAM region at 0x80000000) to these
# offsets. 0x800000 puts the 64 MiB payload at 0x80800000-0x84800000, inside
# the reserved Kernel region (ends 0x82A00000 is too small for 64 MiB, so we
# use the documented guacamole placement that the ABL accepts).
ramdisk_offset = 0x800000
abl_base = 0x80000000
tags_offset = 0x100
pagesize = 4096
header_version = 0
